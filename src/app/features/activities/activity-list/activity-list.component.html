<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Actividades del Equipo</h2>
    <a routerLink="/activities/new" class="btn btn-primary">+ Nueva Actividad</a>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error && activities.length === 0" class="alert alert-info">
    No hay actividades registradas.
  </div>

  <div class="table-responsive" *ngIf="!loading && activities.length > 0">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Título</th>
          <th>Responsable</th>
          <th>Inicio</th>
          <th>Conclusión</th>
          <th>Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of activities">
          <td>{{ a.title }}</td>
          <td>{{ a.assignedUserId }}</td>
          <td>{{ a.scheduledStart | date:'dd/MM/yyyy' }}</td>
          <td>{{ a.scheduledEnd   | date:'dd/MM/yyyy' }}</td>
          <td><span [class]="statusClass(a.status)">{{ statusLabels[a.status] }}</span></td>
          <td class="text-end">
            <a [routerLink]="['/activities', a.id, 'edit']"
               class="btn btn-sm btn-outline-secondary me-1">Editar</a>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(a.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
