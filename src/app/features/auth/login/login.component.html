<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4 fw-bold">Activity Tracker</h4>
      <p class="text-center text-muted mb-4">Inicia sesi&oacute;n para continuar</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <div class="mb-3">
          <label for="companyCode" class="form-label">
            Empresa
            @if (isGlobalUser) {
              <span class="text-muted small">(opcional)</span>
            } @else {
              <span class="text-danger">*</span>
            }
          </label>
          <select
            id="companyCode"
            class="form-select"
            [class.is-invalid]="showCompanyError"
            formControlName="companyCode"
          >
            <option value="">— Selecciona una empresa —</option>
            @for (c of companies; track c.code) {
              <option [value]="c.code">{{ c.name }}</option>
            }
          </select>
          @if (showCompanyError) {
            <div class="invalid-feedback d-block">Debes seleccionar una empresa.</div>
          }
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="form-control"
            [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched"
            formControlName="username"
            placeholder="Usuario"
            autocomplete="username"
          />
          <div class="invalid-feedback">El usuario es requerido.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contrase&ntilde;a</label>
          <input
            id="password"
            type="password"
            class="form-control"
            [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
            formControlName="password"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            autocomplete="current-password"
          />
          <div class="invalid-feedback">La contrase&ntilde;a es requerida.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Ingresando...
          } @else {
            Ingresar
          }
        </button>

      </form>
    </div>
  </div>
</div>
