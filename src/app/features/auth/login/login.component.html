<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <img src="favicon.ico" alt="Jestr" style="width:72px;height:72px;object-fit:contain">
      </div>
      <h4 class="card-title text-center mb-2 fw-bold">Activity Tracker</h4>
      <p class="text-center text-muted mb-4">Inicia sesi&oacute;n para continuar</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <div class="mb-3">
          <label for="companyCode" class="form-label">
            Empresa
            @if (!isGlobalUser) {
              <span class="text-danger">*</span>
            }
          </label>
          <select
            id="companyCode"
            class="form-select"
            [class.is-invalid]="showCompanyError"
            formControlName="companyCode"
          >
            <option value="">— Selecciona una empresa —</option>
            @for (c of companies; track c.code) {
              <option [value]="c.code">{{ c.name }}</option>
            }
          </select>
          @if (showCompanyError) {
            <div class="invalid-feedback d-block">Debes seleccionar una empresa.</div>
          }
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="form-control"
            [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched"
            formControlName="username"
            placeholder="Usuario"
            autocomplete="username"
          />
          <div class="invalid-feedback">El usuario es requerido.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contrase&ntilde;a</label>
          <div class="input-group has-validation">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
              formControlName="password"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              autocomplete="current-password"
            />
            <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              @if (showPassword) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
            <div class="invalid-feedback">La contrase&ntilde;a es requerida.</div>
          </div>
        </div>

        <div class="d-flex justify-content-between mb-3" style="font-size:13px">
          <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
          <a routerLink="/register">Solicitar acceso</a>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Ingresando...
          } @else {
            Ingresar
          }
        </button>

      </form>
    </div>
  </div>
</div>
